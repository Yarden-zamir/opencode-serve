services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    pull_policy: always
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_PARAMS_FILE: ${KITSHN_PARAMS_FILE}
      KITSHN_DATA_DIR: ${KITSHN_DATA_DIR}
      KITSHN_LOG_DIR: ${KITSHN_LOG_DIR}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
    volumes:
      - ${KITSHN_DATA_DIR}:/root/.local/share/opencode
      - /persistent/Yarden-zamir/opencode-telegram-bot/prod/.config/opencode/tools:/root/.config/opencode/tools
    networks:
      - default
      - kitshn-edge
    healthcheck:
      test: ["CMD", "opencode", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  socket-proxy:
    image: alpine/socat:latest
    pull_policy: always
    command: ["UNIX-LISTEN:${KITSHN_DEFAULT_SOCKET},fork,unlink-early,mode=666", "TCP:opencode:4096"]
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    depends_on:
      - opencode
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  kitshn-edge:
    external: true
